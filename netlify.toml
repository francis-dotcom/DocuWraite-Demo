# DocuWraite web UI (Expo static export).
# Set EXPO_PUBLIC_DOCUWRAITE_API_URL in Netlify → Site configuration → Environment variables
# to your hosted API URL (e.g. https://docuwraite-api.onrender.com).

[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # 0.85 ≈ zoomed out ~15% on Netlify (tune in Netlify env vars if needed)
  EXPO_PUBLIC_WEB_INITIAL_SCALE = "0.85"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
